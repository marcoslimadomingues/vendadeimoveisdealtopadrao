# Nginx — duas opções de entrega do HTML5 puro:
#   A) arquivos estáticos exportados (tools/export_static.py → dist/)
#   B) proxy reverso para o app Flask (waitress/gunicorn na porta 8000)
# Em ambos: 404 real, nenhum noindex em página 200 e Bot Access Log dedicado.

# ---------- Bot Access Log (vale para A e B) ----------
map $http_user_agent $bot_ia {
    default                0;
    ~*GPTBot               1;
    ~*OAI-SearchBot        1;
    ~*ChatGPT-User         1;
    ~*ClaudeBot            1;
    ~*Claude-SearchBot     1;
    ~*Claude-User          1;
    ~*anthropic-ai         1;
    ~*PerplexityBot        1;
    ~*Perplexity-User      1;
    ~*Googlebot            1;
    ~*GoogleOther          1;
    ~*bingbot              1;
    ~*Bytespider           1;
    ~*Applebot             1;
    ~*Amazonbot            1;
    ~*meta-external        1;
    ~*DuckAssistBot        1;
    ~*MistralAI-User       1;
    ~*CCBot                1;
}
# Formato "combined": compatível com tools/bot_report.py --combined
log_format bots '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

# Atrás do Cloudflare, recupere o IP real (preencha set_real_ip_from com as faixas publicadas pela Cloudflare):
# real_ip_header CF-Connecting-IP;

server {
    listen 443 ssl;
    http2 on;
    server_name www.seudominio.com.br;
    # ssl_certificate / ssl_certificate_key ...

    access_log /var/log/nginx/access.log;
    access_log /var/log/nginx/bots.log bots if=$bot_ia;

    charset utf-8;
    gzip on;
    gzip_types text/css application/xml text/plain image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------------- Opção A: estático ----------------
    root /var/www/altopadrao/dist;

    location /static/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # /imoveis/slug/ → /imoveis/slug/index.html ; inexistente → 404 REAL (sem soft 404)
        try_files $uri $uri/index.html =404;
        add_header Content-Language "pt-BR";
        add_header X-Robots-Tag "index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1";
        add_header Cache-Control "public, max-age=300, s-maxage=600";
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://i.ytimg.com data:; frame-src https://www.youtube-nocookie.com; style-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Mantém o status 404 ao servir a página de erro (nunca "=200").
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "public, max-age=60, s-maxage=60" always;
    }

    # ---------------- Opção B: proxy para o Flask ----------------
    # location / {
    #     proxy_pass http://127.0.0.1:8000;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_intercept_errors off;   # preserva o 404 e os cabeçalhos gerados pelo app
    # }
}

server {
    listen 80;
    server_name seudominio.com.br www.seudominio.com.br;
    return 301 https://www.seudominio.com.br$request_uri;
}

name: Testar, compilar e publicar

# A cada push na main: roda os testes, gera o site estático e, se os segredos FTP existirem,
# publica na hospedagem por FTPS. Sem os segredos, só testa e compila (nada é publicado).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      # Variáveis do repositório (Settings > Secrets and variables > Actions > Variables):
      #   SITE_URL            domínio final, ex.: https://www.seudominio.com.br (padrão: subpasta atual)
      #   FTP_REMOTO          pasta de destino, ex.: /public_html/seudominio.com.br
      #   EXIGIR_DADOS_REAIS  "true" bloqueia a publicação enquanto houver dado provisório
      - name: Checklist de pré-publicação
        run: python tools/pre_publicacao.py ${{ vars.EXIGIR_DADOS_REAIS == 'true' && '--estrito' || '' }}

      - name: Compilar o site estático
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://marcoslima.com.br/altopadrao' }}
        run: python tools/build_cpanel.py --dominio "$SITE_URL"

      - name: Publicar na hospedagem (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTO: ${{ vars.FTP_REMOTO || '/public_html/altopadrao' }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::notice::Segredos FTP_HOST, FTP_USER e FTP_PASS não configurados: testes e build OK, publicação ignorada."
            exit 0
          fi
          python tools/publicar_ftps.py --remoto "$FTP_REMOTO"

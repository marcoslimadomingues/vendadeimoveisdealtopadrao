name: Testar, compilar e publicar

# A cada push na main: roda os testes, gera o site estático e, se os segredos FTP existirem,
# publica na hospedagem por FTPS. Sem os segredos, só testa e compila (nada é publicado).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Compilar o site estático
        run: python tools/build_cpanel.py --dominio https://marcoslima.com.br/altopadrao

      - name: Publicar na hospedagem (FTPS)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::notice::Segredos FTP_HOST, FTP_USER e FTP_PASS não configurados: testes e build OK, publicação ignorada."
            exit 0
          fi
          python tools/publicar_ftps.py --remoto /public_html/altopadrao

name: Testar, compilar e publicar

# testar   : roda em push e em pull request. Não usa segredos. Testa, confere dados provisórios
#            e gera o site estático (artefato).
# publicar : roda só em push/dispatch na main, no ambiente "producao". Único job com acesso
#            aos segredos de FTP. Sem segredos ou sem FTP_REMOTO, ignora a publicação.
#
# Segredos (Settings > Environments > producao, ou Secrets and variables > Actions):
#   FTP_HOST, FTP_USER, FTP_PASS
# Variáveis (Settings > Secrets and variables > Actions > Variables):
#   FTP_REMOTO          pasta do domínio na hospedagem, ex.: /public_html/vendadeimoveisdealtopadrao.com.br
#   SITE_URL            opcional; padrão https://vendadeimoveisdealtopadrao.com.br
#   EXIGIR_DADOS_REAIS  "true": bloqueia a publicação enquanto houver dado provisório
#   FORCAR_INDEXACAO    "true": libera indexação mesmo com dado provisório (padrão: noindex automático)
#   REDIRECIONAR_ANTIGO "true": publica o 301 do endereço antigo (FTP_REMOTO_ANTIGO) para o domínio novo
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testar:
    runs-on: ubuntu-latest
    outputs:
      pendencias: ${{ steps.checklist.outputs.pendencias }}
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://vendadeimoveisdealtopadrao.com.br' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Checklist de pré-publicação
        id: checklist
        run: |
          pend=0
          python tools/pre_publicacao.py --estrito || pend=1
          echo "pendencias=$pend" >> "$GITHUB_OUTPUT"

      - name: Compilar o site estático
        env:
          # com dado provisório o site vai ao ar com noindex; FORCAR_INDEXACAO=true libera
          SITE_NOINDEX: ${{ steps.checklist.outputs.pendencias == '1' && vars.FORCAR_INDEXACAO != 'true' && '1' || '0' }}
        run: |
          echo "SITE_URL=$SITE_URL  SITE_NOINDEX=$SITE_NOINDEX"
          python tools/build_cpanel.py --dominio "$SITE_URL"

      - name: Guardar o site compilado
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/public_html
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  publicar:
    needs: testar
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: producao
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://vendadeimoveisdealtopadrao.com.br' }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_REMOTO: ${{ vars.FTP_REMOTO }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar o site compilado
        uses: actions/download-artifact@v8
        with:
          name: site
          path: build/public_html

      - name: Trava de dados reais
        env:
          EXIGIR: ${{ vars.EXIGIR_DADOS_REAIS }}
          PEND: ${{ needs.testar.outputs.pendencias }}
        run: |
          if [ "$PEND" = "1" ] && [ "$EXIGIR" = "true" ]; then
            echo "::error::Há dado provisório e EXIGIR_DADOS_REAIS=true: publicação bloqueada."
            exit 1
          fi

      - name: Publicar na hospedagem (FTPS)
        run: |
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ]; then
            echo "::notice::Segredos FTP_HOST, FTP_USER e FTP_PASS não configurados: testes e build OK, publicação ignorada."
            exit 0
          fi
          if [ -z "$FTP_REMOTO" ]; then
            echo "::notice::Variável FTP_REMOTO não definida: publicação ignorada (não adivinho a pasta do domínio)."
            exit 0
          fi
          python tools/publicar_ftps.py --remoto "$FTP_REMOTO"

      - name: Redirecionar o endereço antigo (301)
        if: ${{ vars.REDIRECIONAR_ANTIGO == 'true' }}
        env:
          ANTIGO: ${{ vars.FTP_REMOTO_ANTIGO || '/public_html/altopadrao' }}
        run: |
          # só redireciona se o site novo foi (ou pode ser) publicado: evita apontar para um domínio vazio
          if [ -z "$FTP_HOST" ] || [ -z "$FTP_USER" ] || [ -z "$FTP_PASS" ] || [ -z "$FTP_REMOTO" ]; then
            echo "::notice::Sem segredos FTP ou FTP_REMOTO: redirecionamento ignorado."
            exit 0
          fi
          python tools/build_redirecionamento.py --destino "$SITE_URL" --saida build/redirecionamento
          python tools/publicar_ftps.py --remoto "$ANTIGO" --origem build/redirecionamento

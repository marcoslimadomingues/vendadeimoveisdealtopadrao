name: Testar e publicar no GitHub Pages

# site     : roda em push e em pull request. Testa, confere dados provisórios, descobre o endereço
#            do Pages, gera o site estático e guarda o artefato.
# publicar : só em push/dispatch na main. Garante que a origem do Pages seja "GitHub Actions"
#            (troca sozinho se estiver em "Deploy from a branch") e publica o site compilado.
#
# Domínio próprio: Settings > Pages > Custom domain.
# Variáveis opcionais (Settings > Secrets and variables > Actions > Variables):
#   SITE_URL            força a URL de build (padrão: a que o próprio Pages informa)
#   EXIGIR_DADOS_REAIS  "true": bloqueia a publicação enquanto houver dado provisório
#   FORCAR_INDEXACAO    "true": libera indexação mesmo com dado provisório (padrão: noindex automático)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_ativo: ${{ steps.pages.outputs.ativo }}
      pendencias: ${{ steps.checklist.outputs.pendencias }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Testes
        run: python -m pytest -q

      - name: Checklist de pré-publicação
        id: checklist
        run: |
          pend=0
          python tools/pre_publicacao.py --estrito || pend=1
          echo "pendencias=$pend" >> "$GITHUB_OUTPUT"

      - name: Descobrir o endereço do Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_URL_VAR: ${{ vars.SITE_URL }}
        run: |
          ativo=false; url=""
          if resp=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${{ github.repository }}/pages"); then
            if [ "$(echo "$resp" | jq -r '.build_type')" = "workflow" ]; then ativo=true; fi
            url=$(echo "$resp" | jq -r '.html_url // empty')
          fi
          url="${SITE_URL_VAR:-${url%/}}"
          url="${url:-https://vendadeimoveisdealtopadrao.com.br}"
          # antes do certificado ficar pronto a API informa http://; o site sempre é publicado em https
          url="https://${url#*://}"
          echo "ativo=$ativo" >> "$GITHUB_OUTPUT"
          echo "url=${url%/}" >> "$GITHUB_OUTPUT"
          echo "Pages ativo: $ativo | URL de build: ${url%/}"

      - name: Compilar o site estático
        env:
          # com dado provisório o site vai ao ar com noindex; FORCAR_INDEXACAO=true libera
          SITE_NOINDEX: ${{ steps.checklist.outputs.pendencias == '1' && vars.FORCAR_INDEXACAO != 'true' && '1' || '0' }}
        run: |
          echo "SITE_NOINDEX=$SITE_NOINDEX"
          python tools/build_pages.py --dominio "${{ steps.pages.outputs.url }}"

      - name: Guardar o site para o Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages

  publicar:
    needs: site
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Trava de dados reais
        env:
          EXIGIR: ${{ vars.EXIGIR_DADOS_REAIS }}
          PEND: ${{ needs.site.outputs.pendencias }}
        run: |
          if [ "$PEND" = "1" ] && [ "$EXIGIR" = "true" ]; then
            echo "::error::Há dado provisório e EXIGIR_DADOS_REAIS=true: publicação bloqueada."
            exit 1
          fi

      - name: Garantir a origem "GitHub Actions" no Pages
        id: origem
        env:
          GH_TOKEN: ${{ github.token }}
          API: https://api.github.com/repos/${{ github.repository }}/pages
        run: |
          h=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")
          # se a origem já é "GitHub Actions" (ex.: você trocou em Settings > Pages), segue direto
          atual=$(curl -sS "${h[@]}" "$API" | jq -r '.build_type // empty' || true)
          if [ "$atual" = "workflow" ]; then
            echo "A origem do Pages já é GitHub Actions."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 204 = atualizado; 404 = Pages ainda não existe (cria); 409/422 costumam indicar que já está assim
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X PUT "${h[@]}" "$API" -d '{"build_type":"workflow"}' || echo 000)
          if [ "$code" = "404" ]; then
            code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -X POST "${h[@]}" "$API" -d '{"build_type":"workflow"}' || echo 000)
          fi
          echo "resposta da API do Pages: HTTP $code"
          case "$code" in
            200|201|204) echo "ok=true" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "ok=false" >> "$GITHUB_OUTPUT"
              cat /tmp/pages.json; echo
              echo "::error::O token do workflow não pode alterar o Pages (HTTP $code). Faça uma vez em https://github.com/${{ github.repository }}/settings/pages : Build and deployment > Source = GitHub Actions. Depois, Actions > este run > Re-run failed jobs."
              exit 1 ;;
          esac

      - name: Publicar no GitHub Pages
        id: deployment
        if: steps.origem.outputs.ok == 'true'
        uses: actions/deploy-pages@v4
